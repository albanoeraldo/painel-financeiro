<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login • Controle Financeiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="assets/img/favicon.png?v=2" type="image/png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

  <main class="login-page">
    <section class="login-box">

      <!-- LADO ESQUERDO -->
      <div class="login-panel login-panel-left">
        <div class="login-content">
          <h1>Bem vindo(a)!</h1>

          <form id="loginForm" class="login-form">
            <div class="field">
              <label for="email">Usuário</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
              >
            </div>

            <div class="field">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
              >
            </div>

            <div class="login-options">
              <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>

            <button type="submit" id="loginBtn" class="primary">ENTRAR</button>

            <div class="login-error" id="loginError"></div>
          </form>
        </div>
      </div>

      <!-- LADO DIREITO -->
      <div class="login-panel login-panel-right">
        <div class="illustration-box">
          <img src="assets/img/img-login.png" alt="Ilustração de login">
        </div>
      </div>

    </section>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>

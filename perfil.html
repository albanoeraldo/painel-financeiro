<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil • Controle Financeiro</title>
  <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/responsive.css"/>
  <link rel="stylesheet" href="assets/css/tema.css"/>
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <img class="sidebar-logo" src="assets/img/logo.png" alt="Logo">
          <div class="sidebar-brand-text">
            <h2>Financeiro</h2>
            <small>Controle pessoal</small>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="index.html">Dashboard</a>
          <a href="fixas.html">Fixas</a>
          <a href="cartao.html">Cartão</a>
          <a href="metas.html">Metas</a>
          <a href="ano.html">Ano</a>
          <a href="perfil.html" class="active">Perfil</a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <a class="sidebar-user" id="userBadge" href="perfil.html" title="Editar perfil">
          <span class="avatar" id="userAvatar">U</span>
          <span class="name" id="userName">Usuário</span>
        </a>

        <button id="logoutBtn" class="sidebar-logout">Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="container">

        <header class="page-header">
          <div class="brand">
            <h1>Perfil</h1>
            <small>Edite seu nome e avatar</small>
          </div>

          <div class="actions">
            <a class="btn-soft back-btn" href="index.html">Voltar</a>
          </div>
        </header>

        <div class="card">
          <h3 style="margin:0 0 10px;">Meu perfil</h3>

          <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
            <div class="user-badge big" id="avatarPreview">
              <span class="avatar" id="avatarLetter">A</span>
              <span class="name" id="avatarName">Usuário</span>
            </div>

            <div style="flex:1; min-width:260px;">
              <div class="field">
                <label style="display:block; font-size:12px; opacity:.75; margin:0 0 6px;">Nome</label>
                <input id="profileName" type="text" placeholder="Ex: Albano" />
                <small class="helper">Esse nome aparece no topo do sistema.</small>
              </div>

              <div class="field" style="margin-top:12px;">
                <label style="display:block; font-size:12px; opacity:.75; margin:0 0 6px;">Foto (opcional)</label>
                <input id="profilePhoto" type="file" accept="image/*" />
                <small class="helper">A imagem é salva localmente no seu navegador.</small>
              </div>

              <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
                <button id="saveProfile" class="primary" type="button">Salvar</button>
                <button id="removePhoto" class="btn-soft" type="button">Remover foto</button>
                <button id="resetProfile" class="btn-danger" type="button">Resetar perfil</button>
              </div>

              <small id="profileMsg" class="hint" style="display:block; margin-top:10px;"></small>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>

  <div class="dashboard-cat-box" id="dashboardCatBox" aria-hidden="true">
    <button class="dashboard-cat-fixed" id="dashboardCat" type="button" title="Clique no gatinho">
      <span class="dashboard-cat-bubble" id="dashboardCatBubble">miau!</span>
      <span class="dashboard-cat-shadow"></span>
      <img
        src="assets/img/cat-frame-5.png"
        alt="Gatinho do dashboard"
        id="dashboardCatImg"
        class="dashboard-cat-img"
      >
    </button>
  </div>

  <script type="module" src="assets/js/perfil.js"></script>
  <script type="module" src="assets/js/cat.js"></script>
</body>
</html>
